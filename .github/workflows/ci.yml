name: CI/CD Pipeline - Azure ACR & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'build.py'
      - 'test_build.py'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'build.py'
      - 'test_build.py'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Unit Tests
        run: |
          go test -v -race -cover ./...

  build-and-deploy:
    name: Build, Push to ACR & Deploy to Azure
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dynamic Image Metadata
        id: meta
        run: |
          # Extraer nombre del repositorio en minúsculas y sin caracteres inválidos
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          IMAGE_TAG="v1.0.${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_full=${{ secrets.ACR_NAME_URL }}/$REPO_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=${{ secrets.ACR_NAME_URL }}/$REPO_NAME:latest" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_full }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.image_tag }}
            VCS_REF=${{ steps.meta.outputs.short_sha }}
            IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.repo_name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.image_tag }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.short_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Deploy to Azure Container App
        run: |
          # Obtener el entorno de Container Apps del grupo de recursos
          ACA_ENV=$(az containerapp env list --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          echo "Entorno detectado: $ACA_ENV"

          # Verificar si la Container App existe
          if az containerapp show --name "${{ steps.meta.outputs.repo_name }}-app" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Actualizando Container App existente..."
            az containerapp update \
              --name "${{ steps.meta.outputs.repo_name }}-app" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ steps.meta.outputs.image_full }}"
          else
            echo "Creando nueva Container App..."
            az containerapp create \
              --name "${{ steps.meta.outputs.repo_name }}-app" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "$ACA_ENV" \
              --image "${{ steps.meta.outputs.image_full }}" \
              --registry-server "${{ secrets.ACR_NAME_URL }}" \
              --registry-username "${{ secrets.REGISTRY_USERNAME }}" \
              --registry-password "${{ secrets.REGISTRY_PASSWORD }}" \
              --ingress external \
              --target-port 8080 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 1 \
              --max-replicas 1
          fi

      - name: Azure Logout
        if: always()
        run: |
          az logout || true
