name: CI/CD Pipeline - Azure ACR & Deploy

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: Test
  # =========================================================================
  test:
    name: 1. Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Unit Tests
        run: |
          go test -v -race -cover ./...

  # =========================================================================
  # STAGE 2: Build & Push
  # (Se ejecuta en pushes y tags. Se omite si el commit contiene '/deploy')
  # =========================================================================
  build-and-push:
    name: 2. Build & Push Image to ACR
    needs: test
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      !contains(github.event.head_commit.message, '/deploy')
    outputs:
      image_full: ${{ steps.meta.outputs.image_full }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dynamic Image Metadata
        id: meta
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          
          # 1. Si el push fue con un Git Tag específico (ej: 2.0.0 o v2.0.0), usar ese tag exacto
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
          else
            # 2. Si es un push a main, obtener dinámicamente el último Git Tag del repo (ej: 2.0.0)
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
            # Extraer MAJOR.MINOR (ej: de 2.0.0 -> 2.0 o de v2.0.0 -> v2.0)
            BASE_PREFIX=$(echo "$LATEST_TAG" | sed -E 's/\.[0-9]+$//')
            IMAGE_TAG="${BASE_PREFIX}.${{ github.run_number }}"
          fi
          
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          echo "Tag resuelto: $IMAGE_TAG"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_full=${{ secrets.ACR_NAME_URL }}/$REPO_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=${{ secrets.ACR_NAME_URL }}/$REPO_NAME:latest" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_full }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.image_tag }}
            VCS_REF=${{ steps.meta.outputs.short_sha }}
            IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.repo_name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.image_tag }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.short_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Azure Logout
        if: always()
        run: |
          az logout || true

  # =========================================================================
  # STAGE 3: Deploy to Azure Container App
  # - Se omite si el commit contiene '/notdeploy'
  # - Si el commit contiene '/deploy', despliega la última imagen (:latest)
  # =========================================================================
  deploy:
    name: 3. Deploy to Azure Container App
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' &&
      !contains(github.event.head_commit.message, '/notdeploy') &&
      (
        needs.build-and-push.result == 'success' ||
        contains(github.event.head_commit.message, '/deploy')
      )
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy or Update Container App
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          
          # Determinar imagen a desplegar
          if [ -n "${{ needs.build-and-push.outputs.image_full }}" ]; then
            TARGET_IMAGE="${{ needs.build-and-push.outputs.image_full }}"
          else
            TARGET_IMAGE="${{ secrets.ACR_NAME_URL }}/$REPO_NAME:latest"
          fi
          
          echo "Desplegando imagen: $TARGET_IMAGE"

          # Obtener el entorno de Container Apps del grupo de recursos
          ACA_ENV=$(az containerapp env list --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          echo "Entorno detectado: $ACA_ENV"

          # Verificar si la Container App existe
          if az containerapp show --name "$REPO_NAME-app" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Actualizando Container App existente..."
            az containerapp update \
              --name "$REPO_NAME-app" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$TARGET_IMAGE"
          else
            echo "Creando nueva Container App..."
            az containerapp create \
              --name "$REPO_NAME-app" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "$ACA_ENV" \
              --image "$TARGET_IMAGE" \
              --registry-server "${{ secrets.ACR_NAME_URL }}" \
              --registry-username "${{ secrets.REGISTRY_USERNAME }}" \
              --registry-password "${{ secrets.REGISTRY_PASSWORD }}" \
              --ingress external \
              --target-port 8080 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 1 \
              --max-replicas 1
          fi

      - name: Azure Logout
        if: always()
        run: |
          az logout || true
